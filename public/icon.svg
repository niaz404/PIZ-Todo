<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222a" />
      <stop offset="50%" stop-color="#12151b" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </linearGradient>
    <linearGradient id="pizGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ea" />
      <stop offset="25%" stop-color="#edd7a4" />
      <stop offset="65%" stop-color="#d4b876" />
      <stop offset="100%" stop-color="#9f7b35" />
    </linearGradient>
    <linearGradient id="pizBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecd59f" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#ecd59f" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ecd59f" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ecd59f" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ecd59f" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#pizBg)" stroke="url(#pizBorder)" stroke-width="12" />
  
  <!-- Subtle Inner Ambient Glow -->
  <circle cx="256" cy="230" r="190" fill="url(#glow)" />
  <rect x="42" y="42" width="428" height="428" rx="96" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2.5" />

  <!-- "PIZ" Typography -->
  <g filter="url(#shadow)">
    <text
      x="256"
      y="320"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="182"
      font-weight="900"
      letter-spacing="4"
      fill="url(#pizGold)"
    >PIZ</text>
  </g>

  <!-- Golden Accent Spark -->
  <path
    d="M 256 120 Q 256 136 270 136 Q 256 136 256 152 Q 256 136 242 136 Q 256 136 256 120 Z"
    fill="#fff6dd"
  />
</svg>